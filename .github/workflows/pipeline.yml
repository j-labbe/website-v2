name: Update Portfolio Data

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - run: pnpm install

      - name: Run pipeline
        run: pnpm --filter @jacklabbe/worker exec tsx scripts/run-pipeline.ts
        env:
          GITHUB_TOKEN: ${{ secrets.PIPELINE_GITHUB_TOKEN }}

      - name: Upload to R2
        run: |
          npx wrangler r2 object put jacklabbe-data/graph.json \
            --file worker/output/graph.json \
            --content-type application/json
          npx wrangler r2 object put jacklabbe-data/projects.json \
            --file worker/output/projects.json \
            --content-type application/json
          npx wrangler r2 object put jacklabbe-data/meta.json \
            --file worker/output/meta.json \
            --content-type application/json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
